
name: Build Kronos APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Kronos source
        run: |
          mkdir source
          ZIP=$(find . -maxdepth 1 -iname 'KRONOS-source*zip' | head -n 1)
          unzip "$ZIP" -d source
          GRADLEW=$(find source -type f -name gradlew | head -n 1)
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kronos-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
